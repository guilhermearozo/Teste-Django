{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if is_update %}Atualizar filme{% else %}Cadastrar filme{% endif %} | Lumière</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="header">
        <span>Lumière</span>
        <a class="button button-header" href="{% url 'movie_list' %}">Voltar ao catálogo</a>
    </div>
    <main class="form-container">
        <h1>{% if is_update %}Atualizar filme{% else %}Cadastrar novo filme{% endif %}</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <button class="button" type="submit">{% if is_update %}Salvar alterações{% else %}Cadastrar filme{% endif %}</button>
                <a class="button button-secondary" href="{% url 'movie_list' %}">Cancelar</a>
            </div>
        </form>
    </main>
</body>
</html>
